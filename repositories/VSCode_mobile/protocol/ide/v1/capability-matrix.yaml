      - one_terminal_end_or_aborted
      - cancel_uses_control_state_machines.cancel_result_transfer
      - cancel_end_aborted_exactly_one_winner
      - chunks_inherit_started_requirements
      - no_stream_key_generation_cursor_or_snapshot_installed

