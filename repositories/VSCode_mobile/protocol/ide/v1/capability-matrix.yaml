effect_guards:
  workspace_lifecycle:
    permission_all: [PERMISSION_WORKSPACE_MANAGE]
    require: [desired_state_precondition, operation_commit_arbitration]
  user_state_write:
    permission_all: [PERMISSION_WORKSPACE_READ]
    require: [owner_principal, exact_revision]
  file_mutation:
    permission_any: [PERMISSION_WORKSPACE_MANAGE, PERMISSION_DOCUMENT_WRITE]
    require: [exact_source_and_target_preconditions, workspace_mutation_barrier, lease_fence_for_open_dirty_documents]
  document_open:
    permission_all: [PERMISSION_WORKSPACE_READ]
    require: [canonical_workspace_path, set_semantics]
  document_close:
    permission_all: [PERMISSION_WORKSPACE_READ]
    require: [document_ownership, set_semantics]
  document_edit:
    permission_all: [PERMISSION_DOCUMENT_WRITE]
    require: [document_lease, base_version, client_incarnation_sequence]
  document_save:
    permission_all: [PERMISSION_DOCUMENT_WRITE]
    require: [exact_document_lease_epoch_at_admission_and_commit, exact_document_version, operation_commit_arbitration]
  document_mutation:
    permission_all: [PERMISSION_DOCUMENT_WRITE]
    require: [exact_document_lease_epoch, exact_document_version]
  lease_mutation:
    require: [lease_target_routes, typed_target, owner_principal, lease_epoch_transition]
  workbench_context:
    permission_all: [PERMISSION_WORKSPACE_READ]
    require: [workbench_control_lease, client_context_sequence]
  execute_extension_command:
    permission_all: [PERMISSION_WORKSPACE_READ]
    require: [extension_generation, trusted_command_policy_registry, expected_policy_digest, dynamic_policy_capability_union, dynamic_policy_permission_union, deny_unclassified_command, workspace_trust_if_policy_requires, exact_workbench_control_lease_epoch_if_policy_requires]
  terminal_create:
    permission_all: [PERMISSION_TERMINAL_CREATE]
    require: [workspace_trust, workbench_control_lease]
  terminal_attach:
    permission_all: [PERMISSION_WORKSPACE_READ]
    require: [terminal_ownership, set_semantics]
  terminal_input:
    permission_all: [PERMISSION_TERMINAL_INPUT]
    require: [terminal_input_lease]
  terminal_close:
    permission_all: [PERMISSION_TERMINAL_INPUT]
    require: [terminal_input_lease, operation_commit_arbitration]
  scm_refresh:
    permission_all: [PERMISSION_WORKSPACE_READ]
    require: [workspace_trust, exact_scm_revision]
  scm_mutation:
    permission_all: [PERMISSION_WORKSPACE_MANAGE]
    require: [workspace_trust, exact_scm_revision, workspace_mutation_barrier]
  debug_start:
    permission_all: [PERMISSION_DEBUG_CONTROL]
    require: [workspace_trust, workbench_control_lease]
  debug_control:
    permission_all: [PERMISSION_DEBUG_CONTROL]
    require: [workspace_trust, debug_control_lease, stop_epoch, operation_commit_arbitration]
  debug_evaluate:
    permission_all: [PERMISSION_DEBUG_CONTROL]
    require: [workspace_trust, debug_control_lease, stop_epoch, state_revision]
  testing_discover:
    permission_all: [PERMISSION_WORKSPACE_READ]
    require: [workspace_trust, workbench_control_lease]
  testing_execute:
    permission_all: [PERMISSION_TASK_RUN]
    require: [workspace_trust, workbench_control_lease, operation_commit_arbitration]
  testing_cancel:
    permission_all: [PERMISSION_TASK_RUN]
    require: [workspace_trust, workbench_control_lease, test_run_ownership, operation_commit_arbitration]
  agent_run:
    permission_all: [PERMISSION_AGENT_RUN]
    require: [workspace_trust, bounded_context]
  agent_approve:
    permission_all: [PERMISSION_AGENT_APPROVE]
    require: [exact_arguments_digest, risk_set, lease_fence_per_target, approval_ttl]
  agent_apply_candidate:
    capabilities: [CAP_AGENT_V1, CAP_DOCUMENT_EDIT_V1, CAP_DOCUMENT_LEASE_V1]
    permission_all: [PERMISSION_AGENT_APPROVE, PERMISSION_DOCUMENT_WRITE]
    require: [candidate_digest, candidate_ttl, lease_fence_per_target, exact_resource_preconditions, workspace_mutation_barrier]
  task_run:
    permission_all: [PERMISSION_TASK_RUN]
    require: [workspace_trust, workbench_control_lease]
  task_terminate:
    permission_all: [PERMISSION_TASK_RUN]
    require: [workspace_trust, workbench_control_lease, task_ownership, operation_commit_arbitration]
  output_command:
    permission_all: [PERMISSION_WORKSPACE_READ]
    require: [workbench_control_lease, channel_ownership]
  operation_read:
    permission_all: [PERMISSION_WORKSPACE_READ]
    require: [operation_visible_to_principal]
  operation_cancel:
    permission_all: [PERMISSION_WORKSPACE_READ]
    require: [operation_owner_or_kind_permission, expected_operation_revision, operation_commit_arbitration]
  export_create:
    permission_all: [PERMISSION_EXPORT]
    require: [volume_operation_lock, operation_commit_arbitration]
  export_cancel:
    permission_all: [PERMISSION_EXPORT]
    require: [export_ownership, operation_commit_arbitration]
  export_download:
    permission_all: [PERMISSION_EXPORT]
    require: [export_ownership, published_artifact, fresh_acl_revision, one_time_exchange]
  workspace_edit_read:
    permission_all: [PERMISSION_WORKSPACE_READ]
    require: [candidate_principal_device_binding, candidate_digest, candidate_ttl]
  workspace_edit_apply:
    permission_all: [PERMISSION_DOCUMENT_WRITE]
    require: [candidate_principal_device_binding, candidate_digest, candidate_ttl, lease_fence_per_target, exact_resource_preconditions, workspace_mutation_barrier]

