    require:
      - unique_snapshot_id_per_session
      - stream_key_capabilities
      - snapshot_payload_capabilities
      - snapshot_key_payload_identity
      - started_kind_equals_begin_kind_equals_decoded_payload_branch
      - start_response_is_terminal_when_present
      - key_generation_high_watermark_constant_on_all_parts
      - contiguous_part_index_and_uncompressed_offset
      - one_terminal_end_or_aborted
      - chunks_inherit_started_requirements
      - install_only_after_end_digest_verification
      - installed_tuple_exactly_matches_active_transfer
      - abort_never_advances_stream_frontier
