    target_branch: document
    target_uuid_equals: [SnapshotTransferMeta.key.document.document_id, DocumentSnapshotPayload.document.document_id]
  TerminalSnapshot.input_lease:
    target_branch: terminal
    target_uuid_equals: [SnapshotTransferMeta.key.terminal.terminal_id, TerminalSnapshot.terminal.terminal_id]
  DebugSnapshot.control_lease:
    target_branch: debug
    target_uuid_equals: [SnapshotTransferMeta.key.debug.debug_session_id, DebugSnapshot.debug_session_id]
  ServerEvent.lease:
    require:
      - lease_target_branch_matches_stream_key_branch
      - lease_target_uuid_equals_stream_key_uuid
