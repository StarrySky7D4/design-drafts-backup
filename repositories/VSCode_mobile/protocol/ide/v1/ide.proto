syntax = "proto3";

package remote_ide.ide.v1;

// Public Flutter <-> IDE Control Plane protocol draft.
//
// Wire invariants not expressible in proto3 are mandatory in every generated
// language's handwritten validator:
// - Uuid.value is exactly 16 bytes and has the UUID version required by the
//   registry. Empty/nil IDs are rejected wherever the field is required.
// - Every count, string, bytes field and nesting level is budgeted before
//   allocation. See Knowledge/PROTOCOL_REGISTRY.md.
// - ClientFrame and ServerFrame are direction-specific. request_id correlates
//   a short request; CommandMeta.idempotency_key deduplicates side effects.
// - Frame.delivery is exclusive routing: responses, replayable events,
//   snapshots, server requests and controls are never combined.
// - Stream cursors are per typed StreamKey. Cursor 0 means "no cursor"; emitted
//   event cursors start at 1 and are strictly increasing within generation.
// - TextEdit ranges all refer to EditBatch.base_version, are sorted ascending,
//   are non-overlapping, and are applied atomically (implementation applies
//   validated ranges from end to start).
// - Terminal bytes are raw PTY bytes. Chunks need not end on UTF-8 boundaries.
// - Snapshot chunks encode one deterministic SnapshotPayload, are independently
//   compressed, and never consume a replayable event cursor.

option optimize_for = SPEED;

// ---------------------------------------------------------------------------
// Common primitives
// ---------------------------------------------------------------------------

message Uuid {
  bytes value = 1;
}

enum DigestAlgorithm {
  DIGEST_ALGORITHM_UNSPECIFIED = 0;
  DIGEST_ALGORITHM_SHA256 = 1;
}

message Digest {
  DigestAlgorithm algorithm = 1;
  bytes value = 2;
}

message Position {
  uint32 line = 1;
  uint32 utf16_column = 2;
}

message Range {
  Position start = 1;
  Position end = 2;
}

message WorkspacePath {
  // Canonical UTF-8, slash-separated path relative to the workspace root.
  string value = 1;
}

message Location {
  Uuid document_id = 1;
  WorkspacePath path = 2;
  Range range = 3;
}

enum NullValue {
  NULL_VALUE_UNSPECIFIED = 0;
  NULL_VALUE_PRESENT = 1;
}

message ListValue {
  repeated Value values = 1;
}

message ObjectField {
  // Keys must be unique. Canonical encoders sort by UTF-8 key bytes.
  string key = 1;
  Value value = 2;
}

message ObjectValue {
  repeated ObjectField fields = 1;
}

message Value {
  oneof kind {
    NullValue null_value = 1;
    bool bool_value = 2;
    sint64 int_value = 3;
    double double_value = 4;
    string string_value = 5;
    bytes bytes_value = 6;
    ListValue list_value = 7;
    ObjectValue object_value = 8;
    WorkspacePath path_value = 9;
    Position position_value = 10;
    Range range_value = 11;
    Location location_value = 12;
  }
}

message CommandMeta {
  // UUIDv4. Required for every command that can have a side effect.
  Uuid idempotency_key = 1;
  int64 deadline_unix_ms = 2;
  // Rejects delayed commands after a workspace/Execution rebuild.
  uint64 expected_workspace_generation = 3;
}

message CommandCompleted {
  bool changed = 1;
}

message OperationStarted {
  Uuid operation_id = 1;
}

message TerminalCreated {
  Uuid terminal_id = 1;
  Uuid operation_id = 2;
}

message AgentTaskStarted {
  Uuid agent_task_id = 1;
  Uuid operation_id = 2;
}

message ExportCreated {
  Uuid export_id = 1;
  Uuid operation_id = 2;
}

message DebugSessionStarted {
  Uuid debug_session_id = 1;
  Uuid operation_id = 2;
}

message TestRunStarted {
  Uuid test_run_id = 1;
  Uuid operation_id = 2;
}

message TaskStarted {
  Uuid task_id = 1;
  Uuid operation_id = 2;
  Uuid terminal_id = 3;
}

message CommandAccepted {
  // Exactly one typed outcome is required. Resource-creating commands must
  // return their stable identity here; operation_id alone is insufficient.
  Uuid idempotency_key = 1;
  oneof outcome {
    CommandCompleted completed = 2;
    OperationStarted operation_started = 3;
    TerminalCreated terminal_created = 4;
    AgentTaskStarted agent_task_started = 5;
    ExportCreated export_created = 6;
    DebugSessionStarted debug_session_started = 7;
    TestRunStarted test_run_started = 8;
    TaskStarted task_started = 9;
  }
}

message PageInfo {
  bytes next_page_token = 1;
  bool truncated = 2;
}

message SafeDetail {
  string key = 1;
  string value = 2;
}

enum ErrorCategory {
  ERROR_CATEGORY_UNSPECIFIED = 0;
  ERROR_CATEGORY_CLIENT = 1;
  ERROR_CATEGORY_AUTH = 2;
  ERROR_CATEGORY_DOMAIN = 3;
  ERROR_CATEGORY_STATE = 4;
  ERROR_CATEGORY_AVAILABILITY = 5;
  ERROR_CATEGORY_COMPATIBILITY = 6;
  ERROR_CATEGORY_RESOURCE = 7;
  ERROR_CATEGORY_TIMEOUT = 8;
  ERROR_CATEGORY_CANCELLATION = 9;
  ERROR_CATEGORY_STORAGE = 10;
  ERROR_CATEGORY_INTERNAL = 11;
}

message PublicError {
  // Stable snake_case code from Knowledge/PROTOCOL_REGISTRY.md.
  string code = 1;
  ErrorCategory category = 2;
  bool retryable = 3;
  uint64 retry_after_ms = 4;
  Uuid operation_id = 5;
  repeated SafeDetail safe_details = 6;
  string localized_fallback = 7;
}

// ---------------------------------------------------------------------------
// Session, capabilities and stream recovery
// ---------------------------------------------------------------------------

enum ClientPlatform {
  CLIENT_PLATFORM_UNSPECIFIED = 0;
  CLIENT_PLATFORM_ANDROID = 1;
  CLIENT_PLATFORM_IOS = 2;
  CLIENT_PLATFORM_WINDOWS = 3;
  CLIENT_PLATFORM_MACOS = 4;
  CLIENT_PLATFORM_LINUX = 5;
}

enum Capability {
  CAP_UNSPECIFIED = 0;
  CAP_DOCUMENT_EDIT_V1 = 1;
  CAP_STATE_RESUME_V1 = 2;
  CAP_DOCUMENT_LEASE_V1 = 3;
  CAP_LANGUAGE_UI_V1 = 4;
  CAP_TERMINAL_V1 = 5;
  CAP_SCM_V1 = 6;
  CAP_DEBUG_V1 = 7;
  CAP_TESTING_V1 = 8;
  CAP_AGENT_V1 = 9;
  CAP_EXPORT_V1 = 10;
  CAP_ZSTD_CHUNKS_V1 = 11;
  CAP_TASK_V1 = 12;
  CAP_OUTPUT_V1 = 13;
  reserved 14 to 63;
}

enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  PERMISSION_WORKSPACE_READ = 1;
  PERMISSION_WORKSPACE_MANAGE = 2;
  PERMISSION_DOCUMENT_WRITE = 3;
  PERMISSION_TERMINAL_CREATE = 4;
  PERMISSION_TERMINAL_INPUT = 5;
  PERMISSION_TASK_RUN = 6;
  PERMISSION_DEBUG_CONTROL = 7;
  PERMISSION_AGENT_RUN = 8;
  PERMISSION_AGENT_APPROVE = 9;
  PERMISSION_EXPORT = 10;
  PERMISSION_ADMIN = 11;
  PERMISSION_DEVICE_CLIPBOARD = 12;
  reserved 13 to 63;
}

message WorkspaceStreamKey {
  Uuid workspace_id = 1;
}

message DocumentStreamKey {
  Uuid document_id = 1;
}

message TerminalStreamKey {
  Uuid terminal_id = 1;
}

message AgentStreamKey {
  Uuid agent_task_id = 1;
}

message ExtensionStreamKey {
  Uuid workspace_id = 1;
}

message OperationStreamKey {
  Uuid operation_id = 1;
}

message DebugStreamKey {
  Uuid debug_session_id = 1;
}

message TestingStreamKey {
  Uuid test_controller_id = 1;
}

message ScmStreamKey {
  Uuid scm_provider_id = 1;
}

message ExportStreamKey {
  Uuid export_id = 1;
}

message TaskStreamKey {
  Uuid task_id = 1;
}

message OutputStreamKey {
  Uuid output_channel_id = 1;
}

message StreamKey {
  oneof key {
    WorkspaceStreamKey workspace = 1;
    DocumentStreamKey document = 2;
    TerminalStreamKey terminal = 3;
    AgentStreamKey agent = 4;
    ExtensionStreamKey extension = 5;
    OperationStreamKey operation = 6;
    DebugStreamKey debug = 7;
    TestingStreamKey testing = 8;
    ScmStreamKey scm = 9;
    ExportStreamKey export = 10;
    TaskStreamKey task = 11;
    OutputStreamKey output = 12;
  }
}

message StreamCursor {
  StreamKey key = 1;
  uint64 generation = 2;
  uint64 cursor = 3;
}

message StreamAck {
  StreamKey key = 1;
  uint64 generation = 2;
  uint64 acknowledged_cursor = 3;
}

message StreamEventMeta {
  StreamKey key = 1;
  uint64 generation = 2;
  // Independent event sequence. It is never a document version, terminal byte
  // offset, extension generation or operation state revision.
  uint64 cursor = 3;
  // Causal canonical document version for derived data; zero if not relevant.
  uint64 causal_document_version = 4;
}

message SnapshotTransferMeta {
  // Snapshot frames never consume event cursors. All parts carry this same
  // transfer identity; the client installs only after validating the terminal
  // part/hash, then sends SnapshotInstalled.
  StreamKey key = 1;
  uint64 generation = 2;
  Uuid snapshot_id = 3;
  uint64 high_watermark_inclusive = 4;
}

enum SnapshotPayloadKind {
  SNAPSHOT_PAYLOAD_KIND_UNSPECIFIED = 0;
  SNAPSHOT_PAYLOAD_KIND_WORKSPACE = 1;
  SNAPSHOT_PAYLOAD_KIND_DOCUMENT = 2;
  SNAPSHOT_PAYLOAD_KIND_CONTRIBUTIONS = 3;
  SNAPSHOT_PAYLOAD_KIND_TERMINAL = 4;
  SNAPSHOT_PAYLOAD_KIND_SCM = 5;
  SNAPSHOT_PAYLOAD_KIND_DEBUG = 6;
  SNAPSHOT_PAYLOAD_KIND_TESTING = 7;
  SNAPSHOT_PAYLOAD_KIND_AGENT = 8;
  reserved 9;
  SNAPSHOT_PAYLOAD_KIND_OPERATION = 10;
  SNAPSHOT_PAYLOAD_KIND_EXPORT = 11;
  SNAPSHOT_PAYLOAD_KIND_TASK = 12;
  SNAPSHOT_PAYLOAD_KIND_OUTPUT = 13;
  reserved 14;
}

message SnapshotBegin {
  // payload_digest covers the exact complete uncompressed SnapshotPayload
  // bytes emitted on the wire; clients verify bytes before parsing and never
  // reserialize to verify the digest.
  uint32 payload_schema_version = 1;
  SnapshotCompression compression = 2;
  uint64 uncompressed_size_bytes = 3;
  uint32 part_count = 4;
  Digest payload_digest = 5;
  SnapshotPayloadKind payload_kind = 6;
}

message SnapshotChunk {
  uint32 part_index = 1;
  uint64 uncompressed_offset = 2;
  uint32 uncompressed_length = 3;
  // Every chunk is independently compressed according to SnapshotBegin.
  // part_digest covers its uncompressed slice. Indices and offsets are
  // contiguous, non-overlapping and must exactly cover the declared size.
  bytes data = 4;
  Digest part_digest = 5;
}

message SnapshotEnd {
  uint32 part_count = 1;
  Digest payload_digest = 2;
}

message SnapshotAborted {
  PublicError error = 1;
}

message SnapshotTransferStarted {
  // This is the terminal response to a request that initiated a stream
  // snapshot. Later parts route only by snapshot_id and are not request parts.
  SnapshotTransferMeta transfer = 1;
  SnapshotPayloadKind payload_kind = 2;
}

enum ResultPayloadKind {
  RESULT_PAYLOAD_KIND_UNSPECIFIED = 0;
  RESULT_PAYLOAD_KIND_AGENT_CANDIDATE = 1;
  RESULT_PAYLOAD_KIND_WORKSPACE_EDIT = 2;
}

message ResultTransferMeta {
  Uuid transfer_id = 1;
}

message ResultBegin {
  // Digest covers the exact complete uncompressed ResultPayload wire bytes.
  ResultPayloadKind payload_kind = 1;
  uint32 payload_schema_version = 2;
  SnapshotCompression compression = 3;
  uint64 uncompressed_size_bytes = 4;
  uint32 part_count = 5;
  Digest payload_digest = 6;
}

message ResultChunk {
  uint32 part_index = 1;
  uint64 uncompressed_offset = 2;
  uint32 uncompressed_length = 3;
  bytes data = 4;
  Digest part_digest = 5;
}

message ResultEnd {
  uint32 part_count = 1;
  Digest payload_digest = 2;
}

message ResultAborted {
  PublicError error = 1;
}

message ResultTransferStarted {
  // Terminal response to the initiating request. Later parts route only by
  // transfer_id and never affect any stream acknowledgement/high-watermark.
  ResultTransferMeta transfer = 1;
  ResultPayloadKind payload_kind = 2;
}

message SnapshotInstalled {
  StreamKey key = 1;
  uint64 generation = 2;
  Uuid snapshot_id = 3;
  uint64 high_watermark_inclusive = 4;
  Digest installed_digest = 5;
}

message RequestStreamSnapshot {
  StreamKey key = 1;
  uint64 expected_generation = 2;
}

message StreamAcknowledgements {
  repeated StreamAck acknowledgements = 1;
}

message ReplayResumePlan {
  uint64 selected_generation = 1;
  uint64 first_replay_cursor_inclusive = 2;
  uint64 high_watermark_inclusive = 3;
  uint64 first_live_cursor_inclusive = 4;
}

message SnapshotResumePlan {
  uint64 selected_generation = 1;
  uint64 high_watermark_inclusive = 2;
  uint64 first_live_cursor_inclusive = 3;
  Uuid snapshot_id = 4;
}

message UnavailableResumePlan {
  PublicError reason = 1;
}

message PermissionDeniedResumePlan {
  uint64 permission_revision = 1;
  PublicError reason = 2;
}

message ResumePlan {
  StreamKey key = 1;
  uint64 requested_generation = 2;
  uint64 requested_cursor = 3;
  oneof plan {
    ReplayResumePlan replay = 4;
    SnapshotResumePlan snapshot = 5;
    UnavailableResumePlan unavailable = 6;
    PermissionDeniedResumePlan permission_denied = 7;
  }
}

enum StreamResetReason {
  STREAM_RESET_REASON_UNSPECIFIED = 0;
  STREAM_RESET_REASON_HISTORY_COMPACTED = 1;
  STREAM_RESET_REASON_GENERATION_CHANGED = 2;
  STREAM_RESET_REASON_SLOW_CONSUMER = 3;
  STREAM_RESET_REASON_PERMISSION_CHANGED = 4;
  STREAM_RESET_REASON_DATA_REPAIRED = 5;
}

message StreamReset {
  StreamKey key = 1;
  uint64 new_generation = 2;
  StreamResetReason reason = 3;
  oneof recovery {
    uint64 replay_from_cursor_inclusive = 4;
    bool snapshot_required = 5;
    PublicError stream_closed = 6;
  }
}

message ClientHello {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string client_build = 3;
  ClientPlatform platform = 4;
  Uuid device_id = 5;
  Uuid client_instance_id = 6;
  Uuid requested_workspace_id = 7;
  Uuid challenge_id = 8;
  bytes challenge_signature = 9;
  repeated Capability required_capabilities = 10;
  repeated Capability optional_capabilities = 11;
  repeated StreamCursor resume_cursors = 12;
  string locale = 13;
  string time_zone = 14;
}

message PermissionSnapshot {
  uint64 revision = 1;
  repeated Permission granted = 2;
}

message HeartbeatPolicy {
  uint32 interval_ms = 1;
  uint32 timeout_ms = 2;
  uint32 max_missed = 3;
}

message ServerHello {
  uint32 selected_protocol_major = 1;
  uint32 selected_protocol_minor = 2;
  string server_build = 3;
  Uuid session_id = 4;
  Uuid workspace_id = 5;
  uint64 workspace_generation = 6;
  string runtime_release = 7;
  repeated Capability enabled_capabilities = 8;
  HeartbeatPolicy heartbeat = 9;
  uint32 max_frame_bytes = 10;
  PermissionSnapshot permissions = 11;
  repeated ResumePlan resume_plans = 12;
  uint64 server_unix_ms = 13;
}

message Heartbeat {
  uint64 nonce = 1;
  uint64 sender_unix_ms = 2;
}

message CancelRequest {
  // Cancels only a non-terminal short request. Long work uses OperationCommand.
  Uuid request_id = 1;
}

message CancelSnapshotTransfer {
  Uuid snapshot_id = 1;
}

message CancelResultTransfer {
  Uuid transfer_id = 1;
}

// ---------------------------------------------------------------------------
// Workspace lifecycle, file tree and search
// ---------------------------------------------------------------------------

enum WorkspaceState {
  WORKSPACE_STATE_UNSPECIFIED = 0;
  WORKSPACE_STATE_STOPPED = 1;
  WORKSPACE_STATE_STARTING = 2;
  WORKSPACE_STATE_READY = 3;
  WORKSPACE_STATE_DEGRADED = 4;
  WORKSPACE_STATE_STOPPING = 5;
  WORKSPACE_STATE_FAILED = 6;
  WORKSPACE_STATE_MAINTENANCE = 7;
}

message WorkspaceSnapshot {
  Uuid workspace_id = 1;
  uint64 workspace_generation = 2;
  WorkspaceState state = 3;
  string display_name = 4;
  string runtime_release = 5;
  uint64 workspace_sequence = 6;
  PermissionSnapshot permissions = 7;
  bool execution_ready = 8;
  PublicError degraded_reason = 9;
  repeated UserWorkspaceStateEntry user_workspace_state = 10;
  LeaseState workbench_control_lease = 11;
}

message StartWorkspace {
  CommandMeta meta = 1;
}

message StopWorkspace {
  CommandMeta meta = 1;
  bool force_after_deadline = 2;
}

message RenameWorkspace {
  CommandMeta meta = 1;
  string display_name = 2;
}

message WorkspaceCommand {
  oneof command {
    StartWorkspace start = 1;
    StopWorkspace stop = 2;
    RenameWorkspace rename = 3;
  }
}

message WorkspaceLifecycleChanged {
  WorkspaceState previous = 1;
  WorkspaceState current = 2;
  uint64 workspace_generation = 3;
  PublicError reason = 4;
}

message PermissionChanged {
  PermissionSnapshot current = 1;
  string reason = 2;
}

message WorkspaceEvent {
  oneof event {
    WorkspaceLifecycleChanged lifecycle = 1;
    PermissionChanged permission = 2;
    FileChangeSet files = 3;
    UserWorkspaceStateChanged user_state = 4;
  }
  // Explicit payload identity; validators must compare it with
  // StreamEventMeta.key.workspace.workspace_id on every frame.
  Uuid workspace_id = 5;
}

enum FileKind {
  FILE_KIND_UNSPECIFIED = 0;
  FILE_KIND_REGULAR = 1;
  FILE_KIND_DIRECTORY = 2;
  FILE_KIND_SYMLINK = 3;
  FILE_KIND_OTHER = 4;
}

message FileEntry {
  WorkspacePath path = 1;
  FileKind kind = 2;
  uint64 size_bytes = 3;
  int64 modified_unix_ms = 4;
  bool executable = 5;
  bool hidden = 6;
  uint64 metadata_revision = 7;
}

message ListDirectoryRequest {
  WorkspacePath directory = 1;
  uint32 page_size = 2;
  bytes page_token = 3;
  bool include_hidden = 4;
}

message ListDirectoryResponse {
  WorkspacePath directory = 1;
  repeated FileEntry entries = 2;
  bytes next_page_token = 3;
  uint64 workspace_sequence = 4;
}

enum FileChangeKind {
  FILE_CHANGE_KIND_UNSPECIFIED = 0;
  FILE_CHANGE_KIND_CREATED = 1;
  FILE_CHANGE_KIND_MODIFIED = 2;
  FILE_CHANGE_KIND_DELETED = 3;
  FILE_CHANGE_KIND_RENAMED = 4;
}

message FileChange {
  FileChangeKind kind = 1;
  WorkspacePath path = 2;
  WorkspacePath previous_path = 3;
  FileEntry current = 4;
}

message FileChangeSet {
  repeated FileChange changes = 1;
}

message FilePrecondition {
  // Exactly one branch is required for every destructive mutation. A true
  // must_not_exist is the only legal bool encoding.
  oneof expected {
    bool must_not_exist = 1;
    uint64 exact_metadata_revision = 2;
    Digest exact_content_digest = 3;
  }
}

message CreateFile {
  CommandMeta meta = 1;
  WorkspacePath path = 2;
  bool overwrite = 3;
  FilePrecondition target_precondition = 4;
  repeated LeaseFence lease_fences = 5;
  bytes bounded_initial_content = 6;
}

message CreateDirectory {
  CommandMeta meta = 1;
  WorkspacePath path = 2;
  FilePrecondition target_precondition = 3;
}

message RenamePath {
  CommandMeta meta = 1;
  WorkspacePath from = 2;
  WorkspacePath to = 3;
  bool overwrite = 4;
  FilePrecondition source_precondition = 5;
  FilePrecondition target_precondition = 6;
  repeated LeaseFence lease_fences = 7;
}

message DeletePath {
  CommandMeta meta = 1;
  WorkspacePath path = 2;
  bool recursive = 3;
  bool use_recoverable_trash = 4;
  FilePrecondition target_precondition = 5;
  repeated LeaseFence lease_fences = 6;
}

message FileMutationCommand {
  oneof command {
    CreateFile create_file = 1;
    CreateDirectory create_directory = 2;
    RenamePath rename = 3;
    DeletePath delete = 4;
  }
}

message FileMutationResult {
  uint64 workspace_sequence = 1;
  repeated FileEntry affected = 2;
}

enum SearchMode {
  SEARCH_MODE_UNSPECIFIED = 0;
  SEARCH_MODE_FILE_NAMES = 1;
  SEARCH_MODE_TEXT = 2;
}

message SearchRequest {
  SearchMode mode = 1;
  string query = 2;
  repeated WorkspacePath roots = 3;
  repeated string include_globs = 4;
  repeated string exclude_globs = 5;
  bool case_sensitive = 6;
  bool regular_expression = 7;
  bool whole_word = 8;
  uint32 max_results = 9;
}

message SearchMatch {
  WorkspacePath path = 1;
  Range range = 2;
  string preview = 3;
  uint32 preview_match_start_utf16 = 4;
  uint32 preview_match_end_utf16 = 5;
}

message SearchResultChunk {
  repeated SearchMatch matches = 1;
  reserved 2;
  bool truncated = 3;
  uint64 workspace_sequence = 4;
  reserved 5;
}

message UserWorkspaceStateChanged {
  string key = 1;
  uint64 revision = 2;
  Value value = 3;
}

message UserWorkspaceStateEntry {
  string key = 1;
  uint64 revision = 2;
  Value value = 3;
}

message SetUserWorkspaceState {
  CommandMeta meta = 1;
  string key = 2;
  uint64 expected_revision = 3;
  Value value = 4;
}

// ---------------------------------------------------------------------------
// Documents, edits and leases
// ---------------------------------------------------------------------------

enum EndOfLine {
  END_OF_LINE_UNSPECIFIED = 0;
  END_OF_LINE_LF = 1;
  END_OF_LINE_CRLF = 2;
}

enum SnapshotCompression {
  SNAPSHOT_COMPRESSION_UNSPECIFIED = 0;
  SNAPSHOT_COMPRESSION_NONE = 1;
  SNAPSHOT_COMPRESSION_ZSTD = 2;
}

message OpenDocumentRequest {
  // Opening a server-side document reference is an idempotent mutation.
  // A write lease is acquired separately with LeaseCommand.
  CommandMeta meta = 1;
  WorkspacePath path = 2;
}

message CloseDocumentRequest {
  CommandMeta meta = 1;
  Uuid document_id = 2;
}

message DocumentDescriptor {
  Uuid document_id = 1;
  WorkspacePath path = 2;
  string language_id = 3;
  string encoding = 4;
  EndOfLine end_of_line = 5;
  bool read_only = 6;
  uint64 canonical_version = 7;
  uint64 saved_version = 8;
  // Stream generation belongs exclusively to Snapshot/Event metadata.
  reserved 9;
}

message DocumentSnapshotPayload {
  DocumentDescriptor document = 1;
  bytes utf8_content = 2;
  LeaseState write_lease = 3;
  // Complete derived state at the same high-water cut. Absence means the
  // client clears that projection, never retaining pre-snapshot values.
  DiagnosticSet diagnostics = 4;
  SemanticTokenFull semantic_tokens = 5;
}

message TextEdit {
  Range range = 1;
  string new_text = 2;
}

message EditBatch {
  CommandMeta meta = 1;
  Uuid document_id = 2;
  uint64 base_version = 3;
  uint64 lease_epoch = 4;
  uint64 client_sequence = 5;
  repeated TextEdit edits = 6;
}

message EditAck {
  Uuid idempotency_key = 1;
  Uuid document_id = 2;
  uint64 client_sequence = 3;
  uint64 base_version = 4;
  uint64 accepted_version = 5;
  uint64 saved_version = 6;
  Digest canonical_digest = 7;
}

message SaveDocument {
  CommandMeta meta = 1;
  Uuid document_id = 2;
  uint64 expected_version = 3;
  uint64 expected_lease_epoch = 4;
}

message RevertDocument {
  CommandMeta meta = 1;
  Uuid document_id = 2;
  uint64 expected_version = 3;
  uint64 expected_lease_epoch = 4;
}

message SetDocumentLanguage {
  CommandMeta meta = 1;
  Uuid document_id = 2;
  uint64 expected_version = 3;
  string language_id = 4;
  uint64 expected_lease_epoch = 5;
}

message DocumentCommand {
  oneof command {
    SaveDocument save = 1;
    RevertDocument revert = 2;
    SetDocumentLanguage set_language = 3;
  }
}

enum DocumentChangeOrigin {
  DOCUMENT_CHANGE_ORIGIN_UNSPECIFIED = 0;
  DOCUMENT_CHANGE_ORIGIN_CLIENT = 1;
  DOCUMENT_CHANGE_ORIGIN_EXTENSION = 2;
  DOCUMENT_CHANGE_ORIGIN_AGENT = 3;
  DOCUMENT_CHANGE_ORIGIN_FORMATTER = 4;
  DOCUMENT_CHANGE_ORIGIN_EXTERNAL_PROCESS = 5;
  DOCUMENT_CHANGE_ORIGIN_GIT = 6;
}

message DocumentChanged {
  Uuid document_id = 1;
  uint64 base_version = 2;
  uint64 canonical_version = 3;
  repeated TextEdit edits = 4;
  DocumentChangeOrigin origin = 5;
  Uuid origin_client_instance_id = 6;
}

message DocumentSaved {
  Uuid document_id = 1;
  uint64 canonical_version = 2;
  uint64 saved_version = 3;
  Digest file_digest = 4;
}

message ExternalDocumentChange {
  Uuid document_id = 1;
  uint64 previous_version = 2;
  uint64 canonical_version = 3;
  Digest file_digest = 4;
  bool conflicted_with_dirty_document = 5;
  // Bounded delta whose coordinates refer to previous_version. Otherwise
  // snapshot_required is true and edits must be empty.
