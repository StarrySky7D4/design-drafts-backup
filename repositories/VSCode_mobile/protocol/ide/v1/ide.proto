  TERMINAL_STATE_EXITED = 3;
  TERMINAL_STATE_FAILED = 4;
}

message TerminalDescriptor {
  Uuid terminal_id = 1;
  string display_name = 2;
  TerminalState state = 3;
  uint32 columns = 4;
  uint32 rows = 5;
  oneof terminal_outcome {
    int32 exit_code = 6;
    PublicError failure = 7;
  }
}

enum TerminalRecoveryMode {
  TERMINAL_RECOVERY_MODE_UNSPECIFIED = 0;
  TERMINAL_RECOVERY_MODE_NORMALIZED_CHECKPOINT = 1;
  TERMINAL_RECOVERY_MODE_CLEAR_AND_RESET_DEGRADED = 2;
}

message TerminalStyle {
  uint32 foreground_rgba = 1;
  uint32 background_rgba = 2;
  bool bold = 3;
  bool italic = 4;
  bool underline = 5;
  bool inverse = 6;
  bool dim = 7;
  bool strikethrough = 8;
}

message TerminalCell {
  string grapheme = 1;
  uint32 display_width = 2;
  uint32 style_index = 3;
}

message TerminalRow {
  repeated TerminalCell cells = 1;
  bool wrapped = 2;
}

message TerminalRenderCheckpoint {
  uint32 schema_version = 1;
  TerminalRecoveryMode recovery_mode = 2;
  uint32 columns = 3;
  uint32 rows = 4;
  uint32 cursor_column = 5;
  uint32 cursor_row = 6;
  bool cursor_visible = 7;
  bool alternate_screen = 8;
  bool origin_mode = 9;
  bool auto_wrap_mode = 10;
  repeated TerminalStyle styles = 11;
  repeated TerminalRow normalized_scrollback = 12;
  repeated TerminalRow normalized_screen = 13;
  // Raw bytes begin from the state represented by this checkpoint.
  uint64 raw_byte_offset = 14;
}

message TerminalSnapshot {
  TerminalDescriptor terminal = 1;
  // render_checkpoint represents state at base_raw_byte_offset; the raw bytes
  // replay from base through next. Its raw_byte_offset must equal base.
  uint64 base_raw_byte_offset = 2;
  uint64 next_raw_byte_offset = 3;
  bytes raw_scrollback = 4;
  bool gap_before_base = 5;
  bool truncated = 6;
  LeaseState input_lease = 7;
  TerminalRenderCheckpoint render_checkpoint = 8;
}

message TerminalChunk {
  Uuid terminal_id = 1;
  uint64 raw_byte_offset = 2;
  bytes data = 3;
  uint64 next_raw_byte_offset = 4;
}

message TerminalResized {
  Uuid terminal_id = 1;
  uint32 columns = 2;
  uint32 rows = 3;
}

message TerminalEvent {
  // Lease changes use the single typed ServerEvent.lease route so the
  // StreamKey-to-LeaseTarget identity validator cannot be bypassed.
  reserved 4;
  reserved "input_lease";
  oneof event {
    TerminalDescriptor state = 1;
    TerminalChunk output = 2;
    TerminalResized resized = 3;
  }
}

