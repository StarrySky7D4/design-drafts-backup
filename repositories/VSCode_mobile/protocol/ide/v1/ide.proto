  repeated string markdown_blocks = 1;
  Range range = 2;
}

message LocationList {
  repeated Location locations = 1;
  PageInfo page = 2;
}

message ResourceTarget {
  oneof target {
    // Preferred for an open document.
    Uuid document_id = 1;
    // Used for a closed workspace file.
    WorkspacePath workspace_path = 2;
    // Only product-registered non-file schemes are accepted; arbitrary host
    // file:// URIs are rejected.
    string canonical_uri = 3;
  }
}

message TextDocumentEditSet {
  ResourceTarget target = 1;
  oneof precondition {
    uint64 exact_document_version = 2;
    Digest exact_file_digest = 3;
  }
  // All ranges refer to the same precondition state and are non-overlapping.
  repeated TextEdit edits = 4;
}

message CreateResourceEdit {
  WorkspacePath path = 1;
  bool overwrite = 2;
  bool ignore_if_exists = 3;
  bytes bounded_initial_content = 4;
  // Required even when overwrite/ignore_if_exists is set. Those flags retain
  // VS Code intent but never weaken the candidate-time exact target state.
  FilePrecondition target_precondition = 5;
}

message RenameResourceEdit {
  WorkspacePath from = 1;
  WorkspacePath to = 2;
  bool overwrite = 3;
  bool ignore_if_exists = 4;
  FilePrecondition source_precondition = 5;
  FilePrecondition target_precondition = 6;
}

message DeleteResourceEdit {
  WorkspacePath path = 1;
  bool recursive = 2;
  bool ignore_if_missing = 3;
  FilePrecondition target_precondition = 4;
}

message WorkspaceEditOperation {
  oneof operation {
    TextDocumentEditSet text_document = 1;
    CreateResourceEdit create_resource = 2;
    RenameResourceEdit rename_resource = 3;
    DeleteResourceEdit delete_resource = 4;
  }
}

message WorkspaceEdit {
  // Operations execute in listed order under one Mutation Broker barrier and
  // commit atomically or not at all. Resource preconditions are mandatory and
  // are included in the immutable candidate digest; option flags never turn a
  // changed target into a successful no-op.
  repeated WorkspaceEditOperation operations = 1;
}

enum WorkspaceEditSourceKind {
  WORKSPACE_EDIT_SOURCE_KIND_UNSPECIFIED = 0;
  WORKSPACE_EDIT_SOURCE_KIND_COMPLETION = 1;
  WORKSPACE_EDIT_SOURCE_KIND_RENAME = 2;
  WORKSPACE_EDIT_SOURCE_KIND_FORMATTING = 3;
  WORKSPACE_EDIT_SOURCE_KIND_CODE_ACTION = 4;
  WORKSPACE_EDIT_SOURCE_KIND_EXTENSION_COMMAND = 5;
}

message WorkspaceEditReference {
  Uuid candidate_id = 1;
  Digest edit_digest = 2;
  WorkspaceEditSourceKind source = 3;
  uint64 extension_generation = 4;
  Uuid originating_document_id = 5;
  uint64 originating_document_version = 6;
  repeated WorkspacePath affected_paths = 7;
  int64 expires_unix_ms = 8;
}

message GetWorkspaceEditCandidate {
  Uuid candidate_id = 1;
  Digest expected_edit_digest = 2;
}

message ApplyWorkspaceEdit {
  CommandMeta meta = 1;
  Uuid candidate_id = 2;
  Digest expected_edit_digest = 3;
  repeated LeaseFence lease_fences = 4;
}

message WorkspaceEditCommand {
  oneof command {
    GetWorkspaceEditCandidate get = 1;
    ApplyWorkspaceEdit apply = 2;
  }
}

message AppliedResourceRevision {
  ResourceTarget target = 1;
  uint64 canonical_document_version = 2;
  Digest content_digest = 3;
}

message WorkspaceEditApplied {
  Uuid candidate_id = 1;
  Digest edit_digest = 2;
  repeated AppliedResourceRevision revisions = 3;
}

message WorkspaceEditCandidatePayload {
  WorkspaceEditReference descriptor = 1;
  WorkspaceEdit edit = 2;
}

message RenamePrepareResult {
