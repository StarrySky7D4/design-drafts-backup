  uint64 requested_document_version = 2;
  uint64 result_document_version = 3;
  uint64 extension_generation = 4;
  bool stale = 5;
  oneof result {
    CompletionList completion = 6;
    HoverResult hover = 7;
    LocationList locations = 8;
    WorkspaceEditReference workspace_edit = 9;
    RenamePrepareResult rename_prepare = 10;
    CodeActionList code_actions = 11;
    SignatureHelpResult signature_help = 12;
  }
}

enum DiagnosticSeverity {
  DIAGNOSTIC_SEVERITY_UNSPECIFIED = 0;
  DIAGNOSTIC_SEVERITY_ERROR = 1;
