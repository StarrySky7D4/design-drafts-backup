  string placeholder = 2;
}

message CodeAction {
  string action_id = 1;
  string title = 2;
  string kind = 3;
  bool preferred = 4;
  WorkspaceEditReference edit = 5;
  string command_id = 6;
  repeated Value command_arguments = 7;
