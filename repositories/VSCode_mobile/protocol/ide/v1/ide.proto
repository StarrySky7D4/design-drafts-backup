  ExportManifestSummary manifest = 4;
  int64 created_unix_ms = 5;
  int64 expires_unix_ms = 6;
  PublicError terminal_error = 7;
}

message DownloadExchangeDescriptor {
  Uuid export_id = 1;
  // One-time token is exchanged over HTTPS; it is not the Range token.
  bytes one_time_exchange_token = 2;
  string exchange_path = 3;
  int64 exchange_expires_unix_ms = 4;
  uint64 artifact_size_bytes = 5;
  Digest artifact_digest = 6;
}

message ExportEvent {
  ExportSnapshot current = 1;
}

// Canonical protobuf serialization of exactly one payload is chunked by
// ServerSnapshot. Payloads are never embedded directly in an event frame.
message SnapshotPayload {
  reserved 9, 14;
  oneof payload {
    WorkspaceSnapshot workspace = 1;
    DocumentSnapshotPayload document = 2;
    ContributionSnapshot contributions = 3;
    TerminalSnapshot terminal = 4;
    ScmSnapshot scm = 5;
    DebugSnapshot debug = 6;
    TestingSnapshot testing = 7;
    AgentTaskSnapshot agent = 8;
    OperationSnapshot operation = 10;
    ExportSnapshot export = 11;
    TaskSnapshot task = 12;
    OutputSnapshot output = 13;
  }
}

// Request-result transfers are deliberately separate from stream snapshots:
// they have no StreamKey, generation, high-watermark or SnapshotInstalled.
message ResultPayload {
  oneof payload {
    AgentCandidateEdit agent_candidate = 1;
    WorkspaceEditCandidatePayload workspace_edit = 2;
  }
}

// ---------------------------------------------------------------------------
// Direction-specific session frames
// ---------------------------------------------------------------------------

message RequestMeta {
  Uuid request_id = 1;
  int64 deadline_unix_ms = 2;
}

message ClientRequest {
  // Required and unique within the client incarnation. Every request receives
  // exactly one terminal response, even when earlier response parts were sent.
  RequestMeta meta = 1;
  reserved 10;
  oneof request {
    WorkspaceCommand workspace_command = 11;
    ListDirectoryRequest list_directory = 12;
    FileMutationCommand file_mutation = 13;
    SearchRequest search = 14;
    SetUserWorkspaceState set_user_state = 15;
    OpenDocumentRequest open_document = 16;
    CloseDocumentRequest close_document = 17;
    EditBatch edit_batch = 18;
    DocumentCommand document_command = 19;
    LeaseCommand lease_command = 20;
    WorkbenchContextUpdate workbench_context = 21;
    ExecuteCommandRequest execute_command = 22;
    TreeViewRequest tree_view = 23;
    QuickPickPageRequest quick_pick_page = 24;
    LanguageRequest language_request = 25;
    TerminalCommand terminal_command = 26;
    ScmCommand scm_command = 27;
    ScmPageRequest scm_page = 28;
    DebugCommand debug_command = 29;
    DebugRequest debug_request = 30;
    TestingCommand testing_command = 31;
    TestingPageRequest testing_page = 32;
    AgentCommand agent_command = 33;
    GetAgentCandidateRequest get_agent_candidate = 34;
    TaskCommand task_command = 35;
    OutputCommand output_command = 36;
    OperationCommand operation_command = 37;
    ExportCommand export_command = 38;
    WorkspaceEditCommand workspace_edit_command = 39;
  }
}

message ClientServerResponse {
  oneof response {
    UiResponse ui = 1;
  }
}

message ClientControl {
  oneof control {
    Heartbeat heartbeat = 1;
    StreamAcknowledgements acknowledgements = 2;
    SnapshotInstalled snapshot_installed = 3;
    RequestStreamSnapshot request_snapshot = 4;
    // Fire-and-forget control. The target request itself receives the single
    // terminal cancelled/too-late response.
    CancelRequest cancel_request = 5;
    CancelSnapshotTransfer cancel_snapshot_transfer = 6;
    CancelResultTransfer cancel_result_transfer = 7;
  }
}

message ClientFrame {
  // Must equal the negotiated major (or the offered major for ClientHello).
  uint32 protocol_major = 1;
  // Zero only for hello. CommandMeta must carry this identical generation.
  uint64 expected_workspace_generation = 2;
  oneof delivery {
    ClientHello hello = 10;
    ClientRequest request = 11;
    ClientServerResponse server_response = 12;
    ClientControl control = 13;
  }
}

enum ResponseDisposition {
  RESPONSE_DISPOSITION_UNSPECIFIED = 0;
  RESPONSE_DISPOSITION_PARTIAL = 1;
  RESPONSE_DISPOSITION_TERMINAL = 2;
}

message ResponseMeta {
  Uuid in_reply_to = 1;
  uint32 part_index = 2;
  // Exactly one TERMINAL response per request. No later part is legal.
  ResponseDisposition disposition = 3;
  uint64 observed_workspace_generation = 4;
}

message ServerResponse {
  ResponseMeta meta = 1;
  // Removed before v1 freeze: complete workspace/export state is delivered by
  // typed stream snapshots; workspace-edit descriptors are carried inside
  // LanguageResponse or fetched through ResultTransfer. Names/numbers cannot
  // be reused.
  reserved 11, 15, 27, 31;
  reserved "workspace", "export", "workspace_edit_reference";
  oneof response {
    PublicError error = 10;
    ListDirectoryResponse list_directory = 12;
    FileMutationResult file_mutation = 13;
    SearchResultChunk search_result = 14;
    EditAck edit_ack = 16;
    LeaseState lease_state = 17;
    ExecuteCommandResponse execute_command = 18;
    TreeViewResponse tree_view = 19;
    QuickPickPageResponse quick_pick_page = 20;
    LanguageResponse language = 21;
    ScmPageResponse scm_page = 22;
    DebugResponse debug = 23;
    DebugEvaluateResult debug_evaluate = 24;
    TestingPageResponse testing_page = 25;
    OperationSnapshot operation = 26;
    DownloadExchangeDescriptor download_exchange = 28;
    CommandAccepted command_accepted = 29;
    SnapshotTransferStarted snapshot_started = 30;
    WorkspaceEditApplied workspace_edit_applied = 32;
    ResultTransferStarted result_transfer_started = 33;
  }
}

message ServerEvent {
  // Validator requires meta.key identity to equal the resource identity inside
  // the selected payload; mismatches are protocol violations, never rerouted.
  StreamEventMeta meta = 1;
  oneof event {
    WorkspaceEvent workspace = 10;
    DocumentEvent document = 11;
    LeaseState lease = 12;
    ContributionDelta contribution = 13;
    TreeViewInvalidated tree_view = 14;
    DiagnosticSet diagnostics = 15;
    SemanticTokensEvent semantic_tokens = 16;
    TerminalEvent terminal = 17;
    ScmEvent scm = 18;
    DebugEvent debug = 19;
    TestingEvent testing = 20;
    AgentEvent agent = 21;
    OperationEvent operation = 22;
    ExportEvent export = 23;
    TaskEvent task = 24;
    OutputEvent output = 25;
  }
}

message ServerSnapshot {
  // key/generation/payload_kind/decoded resource ID must match the registry's
  // one-to-one identity matrix. Only SnapshotEnd followed by exact
  // SnapshotInstalled may advance the high-water frontier.
  SnapshotTransferMeta meta = 1;
  reserved 2;
  oneof part {
    SnapshotBegin begin = 10;
    SnapshotChunk chunk = 11;
    SnapshotEnd end = 12;
    SnapshotAborted aborted = 13;
  }
}

message ServerResultTransfer {
  ResultTransferMeta meta = 1;
  oneof part {
    ResultBegin begin = 10;
    ResultChunk chunk = 11;
    ResultEnd end = 12;
    ResultAborted aborted = 13;
  }
}

message ServerRequest {
  oneof request {
    UiRequest ui = 1;
  }
}

message SessionFailure {
  PublicError error = 1;
  bool close_connection = 2;
}

message ServerControl {
  oneof control {
    ServerHello hello = 1;
    Heartbeat heartbeat = 2;
    StreamReset stream_reset = 3;
    CancelUiRequest cancel_ui_request = 4;
    Notification notification = 5;
    ProgressUpdate progress = 6;
    SessionFailure session_failure = 7;
  }
}

message ServerFrame {
  uint32 protocol_major = 1;
  // The delivery branch is the complete routing contract. Validators reject
  // empty branches and domain bodies carried through the wrong branch.
  oneof delivery {
    ServerResponse response = 10;
    ServerEvent event = 11;
    ServerSnapshot snapshot = 12;
    ServerRequest request = 13;
    ServerControl control = 14;
    ServerResultTransfer result_transfer = 15;
  }
}
