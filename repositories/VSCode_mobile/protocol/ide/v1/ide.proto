  int64 started_unix_ms = 5;
  int64 updated_unix_ms = 6;
  int64 terminal_unix_ms = 7;
  // Required iff state is terminal; exactly one branch must agree with state.
  oneof terminal_outcome {
    OperationSucceeded succeeded = 8;
    PublicError failed = 9;
    OperationCancelled cancelled = 10;
    OperationDeadlineExceeded deadline_exceeded = 11;
  }
  // Monotonic within the operation. Cancellation must name the exact observed
