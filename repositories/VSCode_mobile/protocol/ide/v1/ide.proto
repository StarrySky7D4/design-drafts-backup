  string item_id = 1;
  string label = 2;
  string detail = 3;
  string documentation_markdown = 4;
  CompletionItemKind kind = 5;
  string sort_text = 6;
  string filter_text = 7;
  string insert_text = 8;
  bool insert_as_snippet = 9;
  // Immutable, version-bound server candidate; applying it is a separate
  // effectful WorkspaceEditCommand.
  WorkspaceEditReference apply_edit = 10;
  reserved 11;
  string command_id = 12;
  string opaque_handle = 13;
  uint64 extension_generation = 14;
  bool requires_resolution = 15;
}

message CompletionList {
  repeated CompletionItem items = 1;
  bool incomplete = 2;
  PageInfo page = 3;
}

